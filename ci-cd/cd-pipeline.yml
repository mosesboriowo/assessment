# ---------------------------------------------------------------------------
# Cashonrails API — build, scan, publish, deploy, verify, rollback.
# Extends the app's existing test workflow (.github/workflows/ci.yml) rather
# than replacing it. Credentials come from GitHub Actions secrets / OIDC —
# never committed. This same pipeline template is reused by every service on
# the platform (docs/platform-design); only the image name and chart values
# change per service.
# ---------------------------------------------------------------------------
name: cd

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

env:
  IMAGE: swr.af-north-1.myhuaweicloud.com/cashonrails/api
  CLUSTER: cor-staging-cce

jobs:
  test-build-scan-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Automated tests (the app already ships a suite).
      - name: PHP tests
        run: |
          composer install --no-interaction --prefer-dist
          php artisan test

      # 2. Build an immutable image tagged with the commit SHA.
      - name: Build image
        run: docker build -t "$IMAGE:${GITHUB_SHA::12}" .

      # 3. Security gates: image CVEs (Trivy) + static analysis (SonarQube).
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE }}:${{ github.sha }}"
          severity: HIGH,CRITICAL
          exit-code: "1" # fail the build on high/critical findings
      - name: SonarQube SAST
        run: echo "sonar-scanner (SAST) — quality gate must pass"

      # 4. Publish to SWR (Huawei container registry).
      - name: Login + push to SWR
        run: |
          echo "${{ secrets.SWR_PASSWORD }}" | docker login swr.af-north-1.myhuaweicloud.com \
            -u "${{ secrets.SWR_USERNAME }}" --password-stdin
          docker push "$IMAGE:${GITHUB_SHA::12}"

  infra:
    needs: test-build-scan-publish
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: terraform/envs/staging } }
    env:
      HW_ACCESS_KEY: ${{ secrets.HW_ACCESS_KEY }}
      HW_SECRET_KEY: ${{ secrets.HW_SECRET_KEY }}
      TF_VAR_node_password: ${{ secrets.NODE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      # Infra quality gates the brief asks for at minimum.
      - run: terraform fmt -check -recursive ../..
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -out=tfplan
      - run: terraform apply -auto-approve tfplan # prod would require manual approval

  deploy:
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl for CCE
        run: echo "fetch CCE kubeconfig via Huawei CLI using the scoped CI credential"
      # 5. Deploy via Helm (readiness-probe gated rolling update).
      - name: Helm deploy
        run: |
          helm upgrade --install cashonrails-api deploy/helm/service \
            --set image.tag="${GITHUB_SHA::12}" \
            --namespace staging --create-namespace --wait --timeout 5m
      # 6. Run DB migrations as a one-off job before marking the release good.
      - name: Migrate
        run: kubectl -n staging create job --from=cronjob/migrate migrate-${GITHUB_SHA::12} || \
             kubectl -n staging exec deploy/cashonrails-api -- php artisan migrate --force
      # 7. Smoke test the health endpoint + a real route.
      - name: Smoke test
        run: |
          kubectl -n staging rollout status deploy/cashonrails-api --timeout=120s
          curl -fsS https://api.staging.cashonrails.internal/api/v1/health
      # 8. Auto-rollback if the rollout/smoke failed.
      - name: Rollback on failure
        if: failure()
        run: helm rollback cashonrails-api --namespace staging
