# ---------------------------------------------------------------------------
# Cashonrails API — build, scan, publish, deploy, verify, rollback.
# Extends the app's existing test workflow (.github/workflows/ci.yml) rather
# than replacing it. Credentials come from GitHub Actions secrets / OIDC —
# never committed. This same pipeline template is reused by every service on
# the platform (docs/platform-design); only the image name and chart values
# change per service.
# ---------------------------------------------------------------------------
name: cd

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

env:
  IMAGE: swr.af-south-1.myhuaweicloud.com/cashonrails/api
  CLUSTER: cor-staging-cce

jobs:
  test-build-scan-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Automated tests (the app already ships a suite).
      - name: PHP tests
        run: |
          composer install --no-interaction --prefer-dist
          php artisan test

      # 2. Build an immutable image tagged with the commit SHA.
      - name: Build image
        run: docker build -t "$IMAGE:${GITHUB_SHA::12}" .

      # 3. Security gates: image CVEs (Trivy) + static analysis (SonarQube).
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE }}:${{ github.sha }}"
          severity: HIGH,CRITICAL
          exit-code: "1" # fail the build on high/critical findings
      - name: SonarQube SAST
        run: echo "sonar-scanner (SAST) — quality gate must pass"

      # 4. Publish to SWR (Huawei container registry).
      - name: Login + push to SWR
        run: |
          echo "${{ secrets.SWR_PASSWORD }}" | docker login swr.af-south-1.myhuaweicloud.com \
            -u "${{ secrets.SWR_USERNAME }}" --password-stdin
          docker push "$IMAGE:${GITHUB_SHA::12}"

  infra:
    needs: test-build-scan-publish
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: terraform/envs/staging } }
    env:
      HW_ACCESS_KEY: ${{ secrets.HW_ACCESS_KEY }}
      HW_SECRET_KEY: ${{ secrets.HW_SECRET_KEY }}
      TF_VAR_node_password: ${{ secrets.NODE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      # Infra quality gates the brief asks for at minimum.
      - run: terraform fmt -check -recursive ../..
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -out=tfplan
      - run: terraform apply -auto-approve tfplan # prod would require manual approval

  # GitOps promotion. CI does NOT touch the cluster (no kubeconfig, no helm).
  # It writes the freshly-built, scanned image SHA into the staging values file
  # and pushes. Argo CD (running inside CCE) detects the commit and syncs:
  # PreSync migration hook -> rolling update -> readiness-gated traffic. A bad
  # release is reverted with `git revert`; the commit IS the audit record.
  promote-staging:
    needs: test-build-scan-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag bump back to the repo
    env:
      APP: cashonrails-api
      VALUES: csh-product/stg/values/cashonrails-api.yml
    steps:
      - uses: actions/checkout@v4
      - name: Pin new image tag in staging values
        run: |
          TAG="${GITHUB_SHA::12}"
          yq -i ".image.tag = \"${TAG}\"" "$VALUES"
      - name: Commit + push (Argo syncs from here)
        run: |
          git config user.name  "ci-bot"
          git config user.email "ci-bot@cashonrails.internal"
          git commit -am "deploy(staging): ${APP} -> ${GITHUB_SHA::12}" || echo "no change"
          git push
      # Promotion to production is a separate, human-approved commit copying this
      # SHA into csh-product/production/values/cashonrails-api.yml. Argo does the
      # rest. Smoke tests + auto-rollback live in the chart's Argo hooks and
      # readiness gating — not in CI.
