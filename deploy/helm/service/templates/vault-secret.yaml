{{- if .Values.vault.enabled }}
# ---------------------------------------------------------------------------
# Vault Secrets Operator (VSO) wiring — rendered per app from its values file.
# Each entry in .Values.vault.sources becomes one Vault→Kubernetes Secret sync.
#   type: dynamic  -> VaultDynamicSecret  (short-lived, per-pod DB creds)
#   type: static   -> VaultStaticSecret   (KV v2: APP_KEY, REDIS_PASSWORD, ...)
# The resulting Secret is named <app>-<source> and is consumed by the Deployment
# via envFrom. The app authenticates to Vault with the Kubernetes auth method
# through the shared VaultAuth ({{ .Values.vault.authRef }}) provisioned once by
# the platform — no static Vault token, nothing sensitive in Git.
# ---------------------------------------------------------------------------
{{- $app := .Values.name }}
{{- $auth := .Values.vault.authRef }}
{{- range .Values.vault.sources }}
---
{{- if eq .type "dynamic" }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: {{ $app }}-{{ .name }}
spec:
  mount: {{ .mount }}
  path: {{ .path }}
  destination:
    name: {{ $app }}-{{ .name }}
    create: true
  # Re-lease before the TTL expires and roll the Deployment so pods pick up the
  # freshly minted credentials — no restart storms, no expired creds in flight.
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ $app }}
  vaultAuthRef: {{ $auth }}
{{- else }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $app }}-{{ .name }}
spec:
  type: kv-v2
  mount: {{ .mount }}
  path: {{ .path }}
  refreshAfter: {{ .refreshAfter | default "1h" }}
  destination:
    name: {{ $app }}-{{ .name }}
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ $app }}
  vaultAuthRef: {{ $auth }}
{{- end }}
{{- end }}
{{- end }}
